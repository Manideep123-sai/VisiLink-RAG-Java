# Server Configuration
server.port=8000

# Application Name
spring.application.name=visilink-rag

# Multipart Upload Configuration (Supporting video uploads up to 500MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Database Configuration (Default H2 in-memory, zero-config startup)
spring.datasource.url=jdbc:h2:mem:visilinkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Production Profile Alternative (uncomment to activate):
# spring.datasource.url=jdbc:mysql://localhost:3306/visilink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=Password@1234
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Google Gemini Multimodal AI Configuration
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}
gemini.api.model=gemini-2.5-flash
gemini.api.embedding-model=gemini-embedding-001

# VisiLink-RAG Research Hyperparameters (Meng & Tong Springer 2025 grounded)
visilink.rag.refractory-window-seconds=10.0
visilink.rag.gating-threshold=0.5
visilink.rag.fusion-alpha=0.5
visilink.rag.fusion-beta=0.5
visilink.rag.frame-size=512
visilink.rag.video-storage-dir=data/videos
